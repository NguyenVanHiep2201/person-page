<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Trang cá nhân của Nguyễn Văn Hiệp - Kỹ sư Tự động hóa, IoT."/>
  <title>Trang cá nhân - NGUYỄN VĂN HIỆP</title>
  
  <!-- Font chữ hiện đại -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lightbox2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/lightbox2@2.11.4/dist/css/lightbox.min.css" rel="stylesheet">

  <style>
    /* --- HỆ THỐNG MÀU DARK MODE & NEON --- */
    :root {
      --primary: #a855f7;        /* Tím Neon */
      --primary-hover: #c084fc;  
      --accent: #3b82f6;         /* Xanh Cyan */
      --bg-main: #0b0717;        /* Nền tối sâu */
      --bg-card: #130d26;        
      --text-title: #f8fafc;     
      --text-body: #cbd5e1;      
      --text-muted: #94a3b8;     
      --border: #241b42;         
      
      --radius-lg: 20px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 20px rgba(168, 85, 247, 0.3);
      --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-body);
      line-height: 1.7;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      transition: var(--transition);
    }

    /* --- NAVBAR (KÍNH MỜ) --- */
    .navbar {
      position: sticky;
      top: 0;
      background: rgba(11, 7, 23, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      box-shadow: var(--shadow-sm);
    }

    .nav-links {
      display: flex;
      gap: 12px;
      list-style: none;
    }

    .nav-links a {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-title);
      padding: 8px 24px;
      border-radius: 30px;
      letter-spacing: 0.5px;
    }

    .nav-links a:hover {
      color: var(--primary-hover);
      background: rgba(168, 85, 247, 0.1);
    }

    .nav-links a.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
    }

    /* --- ĐỒNG HỒ TRONG NAVBAR --- */
    .datetime-widget {
      position: absolute;
      right: 24px;
      text-align: right;
      line-height: 1.4;
    }

    .datetime-widget .time-text {
      font-weight: 700;
      color: var(--primary-hover);
      font-size: 1rem;
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
      letter-spacing: 1px;
    }

    .datetime-widget .date-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* --- HERO SECTION --- */
    .hero-section {
      background: linear-gradient(135deg, #090514 0%, #170d36 100%);
      padding: 80px 20px 60px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .avatar-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .avatar-wrapper::after {
      content: '';
      position: absolute;
      top: -4px; left: -4px; right: -4px; bottom: -4px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--primary), var(--accent), var(--primary));
      background-size: 200% 200%;
      z-index: 1;
      animation: spinWeb 4s linear infinite;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 4px solid #090514;
      object-fit: cover;
      position: relative;
      z-index: 2;
    }

    @keyframes spinWeb {
      0% { background-position: 0% 50%; transform: rotate(0deg); }
      100% { background-position: 100% 50%; transform: rotate(360deg); }
    }

    .hero-section h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
    }

    .hero-subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-style: italic;
      max-width: 500px;
      margin: 0 auto;
    }

    /* --- CONTAINER & BỐ CỤC CHÍNH --- */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px 100px;
    }

    .section-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-title);
      margin-bottom: 40px;
      text-align: center;
      position: relative;
    }

    .section-title::after {
      content: '';
      display: block;
      width: 60px;
      height: 4px;
      background: linear-gradient(to right, var(--primary), var(--accent));
      border-radius: 10px;
      margin: 12px auto 0;
      box-shadow: var(--shadow-glow);
    }

    /* --- THƯ VIỆN ẢNH (GALLERY) --- */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      aspect-ratio: 4 / 3;
      border: 1px solid var(--border);
      position: relative;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: var(--transition);
      cursor: pointer;
    }

    .gallery-item::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(168, 85, 247, 0.2);
      opacity: 0;
      transition: var(--transition);
      z-index: 1;
      pointer-events: none;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      opacity: 0.85; /* Hơi tối lại để nổi bật khi hover */
    }

    /* Hiệu ứng Hover Ảnh */
    .gallery-item:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-glow);
      transform: translateY(-5px);
    }

    .gallery-item:hover::before {
      opacity: 1;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
      opacity: 1;
      filter: contrast(1.1) saturate(1.2);
    }

    /* --- RESPONSIVE MOBILE --- */
    @media (max-width: 850px) {
      .datetime-widget { display: none; }
    }

    @media (max-width: 640px) {
      .navbar { padding: 12px; }
      .nav-links { gap: 5px; width: 100%; justify-content: center; }
      .nav-links a { font-size: 0.85rem; padding: 8px 16px; }
      
      .hero-section { padding: 50px 20px 40px; }
      .hero-section h1 { font-size: 2rem; }
      .avatar { width: 110px; height: 110px; }
      
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); }
    }
  </style>
</head>
<body>

  <!-- Thanh điều hướng -->
  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="index.html" class="active">Trang chủ</a></li>
      <li><a href="about.html">Giới thiệu</a></li>
      <li><a href="blogs.html">Bài viết</a></li>
      <li><a href="projects.html">Dự án</a></li>
      <li><a href="contact.html">Liên hệ</a></li>
    </ul>
    
    <!-- Tiện ích Đồng hồ góc phải -->
    <div class="datetime-widget" id="datetimeWidget"></div>
  </nav>

  <!-- Giới thiệu bản thân -->
  <header class="hero-section">
    <div class="avatar-wrapper">
      <a href="08.2019.jpg" data-lightbox="avatar">
        <img src="08.2019.jpg" alt="Nguyễn Văn Hiệp" class="avatar">
      </a>
    </div>
    <h1>NGUYỄN VĂN HIỆP</h1>
    <p class="hero-subtitle">"A journey of a thousand miles begins with a single step"</p>
  </header>

  <!-- Nội dung chính (Chỉ chứa Gallery Kỷ niệm) -->
  <main class="container">
    <section>
      <h2 class="section-title">Kỷ niệm</h2>
      <div class="gallery-grid">
        <a href="08.2019.jpg" data-lightbox="gallery" class="gallery-item">
          <img src="08.2019.jpg" alt="Kỷ niệm 1">
        </a>
        <a href="ảnh cuối cấp 3.jpg" data-lightbox="gallery" class="gallery-item">
          <img src="ảnh cuối cấp 3.jpg" alt="Kỷ niệm 2">
        </a>
        <a href="ảnh cấp 3 ba vi.jpg" data-lightbox="gallery" class="gallery-item">
          <img src="ảnh cấp 3 ba vi.jpg" alt="Kỷ niệm 3">
        </a>
        <a href="ảnh nắng hoàng hôn.jpg" data-lightbox="gallery" class="gallery-item">
          <img src="ảnh nắng hoàng hôn.jpg" alt="Kỷ niệm 4">
        </a>
        <a href="ảnh sông núi.jpg" data-lightbox="gallery" class="gallery-item">
          <img src="ảnh sông núi.jpg" alt="Kỷ niệm 5">
        </a>
        <a href="ảnh cá nhân tốt nghiệp.jpg" data-lightbox="gallery" class="gallery-item">
          <img src="ảnh cá nhân tốt nghiệp.jpg" alt="Kỷ niệm 6">
        </a>
        <a href="ảnh bằng tốt nghiệp đại học.jpg" data-lightbox="gallery" class="gallery-item">
          <img src="ảnh bằng tốt nghiệp đại học.jpg" alt="Kỷ niệm 7">
        </a>
        <a href="ảnh đồi chè.jpg" data-lightbox="gallery" class="gallery-item">
          <img src="ảnh đồi chè.jpg" alt="Kỷ niệm 8">
        </a>
        <a href="ảnh trường hust.jpg" data-lightbox="gallery" class="gallery-item">
          <img src="ảnh trường hust.jpg" alt="Kỷ niệm 9">
        </a>
      </div>
    </section>
  </main>

  <!-- jQuery & Lightbox JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightbox2@2.11.4/dist/js/lightbox.min.js"></script>
  
  <!-- Script chạy Đồng hồ -->
  <script>
    function updateDateTime() {
      const now = new Date();
      
      const timeStr = now.toLocaleTimeString('vi-VN', { 
        timeZone: 'Asia/Ho_Chi_Minh', 
        hour: '2-digit', minute: '2-digit', second: '2-digit' 
      });
      const solarDateStr = now.toLocaleDateString('vi-VN', { 
        timeZone: 'Asia/Ho_Chi_Minh', 
        day: '2-digit', month: '2-digit', year: 'numeric' 
      });
      
      let lunarStr = "";
      try {
        lunarStr = new Intl.DateTimeFormat('vi-VN', { 
          timeZone: 'Asia/Ho_Chi_Minh', 
          calendar: 'chinese', 
          day: 'numeric', month: 'numeric' 
        }).format(now);
      } catch (e) {
        lunarStr = "N/A";
      }

      const widget = document.getElementById('datetimeWidget');
      if(widget) {
        widget.innerHTML = 
          `<div class="time-text">Hà Nội: ${timeStr}</div>
           <div class="date-text">DL: ${solarDateStr} &nbsp;|&nbsp; ÂL: ${lunarStr}</div>`;
      }
    }
    
    setInterval(updateDateTime, 1000);
    updateDateTime();
  </script>
</body>
</html>
